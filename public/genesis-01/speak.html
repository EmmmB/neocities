<!DOCTYPE html>

<html>
  <head>
    <title>LET ME TALK</title>
    <link href="genesis-01.css?v7" rel="stylesheet" media="screen and (orientation: landscape)">
    <link href="genesis-01_mobile.css" rel="stylesheet" media="screen and (orientation: portrait)">
    
    
   </head>
   <body>

      <div class="screen">

         <img class="display" src="./img/screen/fullscreen.png">

         <span class="response"></span>

         <span class="phrases" id="phrase">
            <span id="1"></span>
            <span id="2"></span>
            <span id="3"></span>
         </span>

         <div  id="loadBar">
            <div id="loadFill"></div>
         </div>
      </div>

      <div class="buttons">

         <span id="sayME" class="buttonImage">
            <button id="pressME" type="button" class="buttonText"></button>
         </span>

         <span id="sayTALK" class="buttonImage">
            <button id="pressTALK" type="button" class="buttonText"></button>
         </span>

         <span id="sayTHEY" class="buttonImage">
            <button id="pressTHEY" type="button" class="buttonText" ></button>
         </span>

         <span id="sayHELP" class="buttonImage">
            <button id="pressHELP" type="button" class="buttonText"></button>
         </span>

         <span id="sayYOU" class="buttonImage">
            <button id="pressYOU" type="button" class="buttonText" ></button>
         </span>

         <span id="sayWORK" class="buttonImage">
            <button id="pressWORK" type="button" class="buttonText"></button>
         </span> 

         <span id="sayTO" class="buttonImage">
            <button id="pressTO" type="button" class="buttonText" ></button>
         </span>

         <span id="sayGO" class="buttonImage">
            <button id="pressGO" type="button" class="buttonText"></button>
         </span>

         <span id="sayLET" class="buttonImage">
            <button id="pressLET" type="button" class="buttonText"></button>
         </span>

         <span id="reset" class="buttonImage">
            <button id="pressReset" class="buttonText" type="button"></button>
         </span>

      </div>



      <script type="module" src="genesis-01.js?v6"></script>
  </body>

</html>
